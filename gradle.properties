# === Create 1.7.10 Unofficial ===
# Based on GTNH ExampleMod 1.7.10 template

modName = Create 1.7.10 Unofficial
modId = create
modGroup = create

# Use modGroup as the Maven publishing group
useModGroupForPublishing = true

# Auto-update build scripts from GTNH upstream
autoUpdateBuildScript = false

# === Minecraft / Forge ===
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# === Developer ===
developmentEnvironmentUserName = Developer

# === Modern Java ===
# Jabel: Java 17 syntax compiled to Java 8 bytecode for Forge 1.7.10 compatibility
# With lwjgl3ify, players run on Java 17+ JVM at runtime
enableModernJavaSyntax = true

# === Generics ===
enableGenericInjection = true

# === Mixins ===
usesMixins = true
forceEnableMixins = true
mixinPlugin = mixin.MixinPlugin
mixinsPackage = mixin

# === Gradle Token ===
generateGradleTokenClass = Tags
gradleTokenVersion = VERSION

# === GTNH Settings ===
gtnh.settings.blowdryerTag =

# === Publishing (unused for personal project) ===
usesMavenPublishing = false

# === Well-known repositories ===
includeWellKnownRepositories = true

# === Spotless (disabled — GitHub rate-limited from our network) ===
disableSpotless = true

# === Non-GTNH Gradle properties ===
org.gradle.jvmargs = -Xmx3G -XX:+UseG1GC
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.configuration-cache = false

# Kotlin
kotlin.code.style = official
